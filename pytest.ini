[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --ignore=libs/backtester.py --ignore=tests/test_backtester.py
# Ignoring backtester for now as it may require more complex mocking than simple unit tests
markers =
    unit: Unit tests
    integration: Integration tests
